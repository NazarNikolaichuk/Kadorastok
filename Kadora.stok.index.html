<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KADORA | Сток одяг</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand-green: #2B5737;
      --brand-light: #F1F1F0;
      --brand-black: #000000;
      --brand-white: #FFFFFF;
      --text-muted: #666666;
      --font-main: 'Montserrat', sans-serif;
      --font-accent: 'Lora', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-main); background-color: var(--brand-light); color: var(--brand-black); line-height: 1.6; padding-bottom: 60px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 8%; background-color: var(--brand-white); position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    .logo { font-size: 30px; font-weight: 700; letter-spacing: 4px; color: var(--brand-green); }
    .tagline-badge { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; border: 1px solid var(--brand-black); padding: 2px 8px; border-radius: 12px; margin-top: 4px; display: inline-block; }

    .header-btns { display: flex; gap: 10px; }
    .cart-btn, .admin-add-btn {
      background: transparent; border: 1px solid var(--brand-black); color: var(--brand-black);
      padding: 8px 16px; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.3s;
    }
    .admin-add-btn { background-color: var(--brand-green); color: var(--brand-white); border: none; }
    .cart-btn:hover { background-color: var(--brand-black); color: var(--brand-white); }
    .cart-badge { background-color: var(--brand-green); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 10px; }

    .hero { text-align: center; padding: 50px 20px 20px; }
    .hero h1 { font-family: var(--font-accent); font-size: 36px; font-weight: 500; }
    .category-title-badge { background-color: var(--brand-green); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 2px; padding: 4px 12px; border-radius: 20px; margin-bottom: 10px; display: inline-block; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; margin-top: 25px; }

    .product-card { background-color: #fff; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; position: relative; }
    .stock-tag { position: absolute; top: 10px; left: 10px; background: #000; color: #fff; font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 4px; }
    .product-image { width: 100%; height: 280px; object-fit: cover; background-color: #E8E8E7; }
    .product-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-family: var(--font-accent); font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .product-price { font-size: 16px; font-weight: 700; color: var(--brand-green); margin-bottom: 12px; }
    .add-to-cart-btn { margin-top: auto; background-color: var(--brand-green); color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }

    /* Форма додавання */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: #fff; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; position: relative; }
    .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 20px; cursor: pointer; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .submit-btn { width: 100%; background: var(--brand-green); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="logo">KADORA</div>
      <div class="tagline-badge">Сток одяг</div>
    </div>
    <div class="header-btns">
      <button class="admin-add-btn" id="openAddModalBtn">+ Додати товар</button>
      <button class="cart-btn" id="openCartBtn">🛒 <span class="cart-badge" id="cartCount">0</span></button>
    </div>
  </header>

  <section class="hero">
    <div class="category-title-badge">Категорія: СТОК</div>
    <h1>Брендовий якісний одяг за доступною ціною</h1>
  </section>

  <main class="container">
    <div class="products-grid" id="productsGrid">
      <div style="grid-column: 1/-1; text-align: center; padding: 40px;">Завантаження товарів...</div>
    </div>
  </main>

  <!-- Вікно для додавання товару -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <button class="close-btn" id="closeAddBtn">&times;</button>
      <h2>Додати новий товар</h2>
      <br>
      <div class="form-group">
        <label>Назва товару</label>
        <input type="text" id="newTitle" placeholder="напр. Худі Oversize">
      </div>
      <div class="form-group">
        <label>Ціна (грн)</label>
        <input type="number" id="newPrice" placeholder="напр. 750">
      </div>
      <button class="submit-btn" id="saveProductBtn">Опублікувати товар</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@sanity/client@6.15.0/dist/sanityClient.browser.mjs';

    // Ваш згенерований токен для доступу
    const token = 'sk7PD50J7SKmEmbVngB9k2Bj16gWrbkNCnfsLgsiE4q793AgjLApHS4L9Y998AZRKH6hPARCeZVRLmIzpUFdLWro4lPkMlZZyO8Z6ii8G92ogGRP9GHiiA9WbVKDmr2guEv6Oe9NaYRKGm9p7b0cW76oJXHvowBqwBHMGPFseQD1TYTpE0A6';

    const client = createClient({
      projectId: '7q6t5vcs',
      dataset: 'production',
      useCdn: false,
      token: token,
      apiVersion: '2024-01-01',
    });

    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      try {
        const products = await client.fetch(`*[_type == "product"]{_id, title, price}`);
        if (!products.length) {
          grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center;">📦 Товарів поки немає. Натисніть "+ Додати товар" зверху, щоб створити перший!</div>';
          return;
        }
        grid.innerHTML = products.map(p => `
          <div class="product-card">
            <div class="stock-tag">STOCK</div>
            <img src="https://via.placeholder.com/400x500/F1F1F0/2B5737?text=KADORA" class="product-image">
            <div class="product-info">
              <div class="product-title">${p.title || 'Стоковий товар'}</div>
              <div class="product-price">${p.price || 0} грн</div>
              <button class="add-to-cart-btn">У кошик</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: red;">Помилка підключення. Перевірте налаштування CORS.</div>';
      }
    }

    document.getElementById('saveProductBtn').onclick = async () => {
      const title = document.getElementById('newTitle').value;
      const price = Number(document.getElementById('newPrice').value);
      if (!title || !price) return alert('Введіть назву та ціну!');

      document.getElementById('saveProductBtn').innerText = 'Збереження...';
      try {
        await client.create({ _type: 'product', title, price, category: 'stock' });
        alert('🎉 Товар успішно додано!');
        document.getElementById('addModal').classList.remove('active');
        document.getElementById('newTitle').value = '';
        document.getElementById('newPrice').value = '';
        loadProducts();
      } catch (err) {
        console.error(err);
        alert('Помилка при збереженні товару. Перевірте консоль.');
      }
      document.getElementById('saveProductBtn').innerText = 'Опублікувати товар';
    };

    document.getElementById('openAddModalBtn').onclick = () => document.getElementById('addModal').classList.add('active');
    document.getElementById('closeAddBtn').onclick = () => document.getElementById('addModal').classList.remove('active');

    loadProducts();
  </script>
</body>
</html>
